services:
  pg:
    image: postgres:15
    environment:
      POSTGRES_DB: demo_wallet
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data
    ports:
        #5432 внутренний порт контейнера
      - "5439:5432"
    volumes:
      - ./postgresdata:/var/lib/postgresql/data


  test_db:
    image: postgres:15
    environment:
      POSTGRES_DB: test_demo_wallet
      POSTGRES_USER: test123
      POSTGRES_PASSWORD: test123
    ports:
      - "5438:5432"
    volumes:
      - ./test_postgresdata:/var/lib/postgresql/data